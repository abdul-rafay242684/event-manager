<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Registration Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand">Event Manager</span>
</nav>

<div class="container my-4">
  <div class="row g-4">
    <div class="col-md-4">
      <form id="form" class="card card-body">
        <h5>Register Attendee</h5>
        <input id="name" class="form-control mb-2" placeholder="Name">
        <input id="event" class="form-control mb-2" placeholder="Event">
        <select id="ticketType" class="form-select mb-2">
          <option value="">Ticket type</option>
          <option>Standard</option>
          <option>VIP</option>
        </select>
        <input id="price" type="number" class="form-control mb-2" placeholder="Ticket price">
        <div id="error" class="text-danger small mb-2"></div>
        <button class="btn btn-primary">Register</button>
      </form>
    </div>
    <div class="col-md-8">
      <h5>Total Revenue: $<span id="total">0</span></h5>
      <div id="list" class="row g-3"></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
